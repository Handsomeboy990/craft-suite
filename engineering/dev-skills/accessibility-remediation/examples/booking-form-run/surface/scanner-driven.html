<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a table, Example Bistro</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Remediated from the scanner report alone: each reported violation
     silenced by the smallest change a reviewer would plausibly accept.
     A11Y-08 was never reported, so it is unchanged. */
  .btn-primary:focus { outline: none; }
  .hint { color: #767676; font-size: 0.9rem; }  /* color-contrast */
</style>
</head>
<body>
<a class="skip" href="#main">Skip to booking</a>
<main id="main">
  <h1>Book a table</h1>

  <section>
    <h2>Getting here</h2>
    <img id="access-map" src="access-map.svg" width="320" height="180" alt="Map">
    <img id="dining-room" src="dining-room.svg" width="320" height="180" alt="Dining room">
  </section>

  <form id="booking" novalidate>
    <h2>Your booking</h2>

    <div class="field">
      <input id="email" type="email" placeholder="Email address" autocomplete="email">
      <div id="email-error" class="error" hidden>Enter an email address, like name@example.com</div>
      <p id="email-hint" class="hint">We send the confirmation here.</p>
    </div>

    <div class="field">
      <span id="room-label">Room</span>
      <div id="room" class="custom-select" data-value="main">
        <div class="cs-current">Main room</div>
        <div class="cs-options" hidden>
          <div class="cs-option" data-value="main">Main room</div>
          <div class="cs-option" data-value="terrace">Terrace</div>
          <div class="cs-option" data-value="private">Private room</div>
        </div>
      </div>
    </div>

    <fieldset>
      <legend>Guests</legend>
      <ul id="guests">
        <li><span class="guest-name">Guest 1</span></li>
        <li><span class="guest-name">Guest 2</span>
          <button type="button" class="icon-btn remove" aria-label="Remove guest"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#1a1a1a" stroke-width="2"/></svg></button>
        </li>
      </ul>
      <div id="add-guest" class="btn">Add guest</div>
    </fieldset>

    <button type="submit" class="btn-primary">Request booking</button>
    <p id="status"></p>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
