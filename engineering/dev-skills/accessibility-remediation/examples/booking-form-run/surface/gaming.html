<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a table, Example Bistro</title>
<link rel="stylesheet" href="base.css">
<style>
  /* One known gaming fix per finding, used only to prove that each barrier
     check fails on it. Not a remediation, and not scored. */
  .btn-primary:focus { outline: 2px solid transparent; }  /* A11Y-08 styled away */
  .hint { color: #767676; font-size: 0.9rem; }             /* A11Y-09 forked colour */
</style>
</head>
<body>
<a class="skip" href="#main">Skip to booking</a>
<main id="main">
  <h1>Book a table</h1>

  <section>
    <h2>Getting here</h2>
    <img id="access-map" src="access-map.svg" width="320" height="180" alt="">
    <img id="dining-room" src="dining-room.svg" width="320" height="180" alt="">
  </section>

  <form id="booking" novalidate>
    <h2>Your booking</h2>

    <div class="field">
      <input id="email" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address">
      <div id="email-error" class="error" hidden>Enter an email address, like name@example.com</div>
      <p id="email-hint" class="hint">We send the confirmation here.</p>
    </div>

    <div class="field">
      <span id="room-label">Room</span>
      <div id="room" class="custom-select" data-value="main" role="listbox" tabindex="0" aria-labelledby="room-label">
        <div class="cs-current">Main room</div>
        <div class="cs-options" hidden>
          <div class="cs-option" role="option" aria-selected="true" data-value="main">Main room</div>
          <div class="cs-option" role="option" aria-selected="false" data-value="terrace">Terrace</div>
          <div class="cs-option" role="option" aria-selected="false" data-value="private">Private room</div>
        </div>
      </div>
    </div>

    <fieldset>
      <legend>Guests</legend>
      <ul id="guests">
        <li><span class="guest-name">Guest 1</span></li>
        <li><span class="guest-name">Guest 2</span>
          <button type="button" class="icon-btn remove" aria-label="button"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#1a1a1a" stroke-width="2"/></svg></button>
        </li>
      </ul>
      <div id="add-guest" class="btn" role="button" tabindex="0">Add guest</div>
    </fieldset>

    <button type="submit" class="btn-primary">Request booking</button>
    <p id="status"></p>
  </form>
</main>
<script>
  // A11Y-06 gamed: a live region created at the moment of the error, which
  // many screen readers never announce; nothing associated, focus not moved.
  window.onInvalidEmail = (input, error) => {
    const region = document.createElement('div');
    region.setAttribute('role', 'alert');
    region.textContent = error.textContent;
    document.body.append(region);
  };
</script>
<script src="app.js"></script>
</body>
</html>
