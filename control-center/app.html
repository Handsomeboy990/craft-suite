<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Center</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #eef1f5;
    --panel-3: #e6eaf0;
    --border: #dfe3ea;
    --border-strong: #c8cfda;
    --text: #171a1f;
    --text-2: #3d434d;
    --muted: #5c6572;
    --accent: #2f6feb;
    --accent-2: #1b5fd9;
    --accent-soft: #dce8ff;
    --good: #1a9d5f;
    --good-soft: #d6f2e3;
    --warn: #a9760c;
    --warn-soft: #fbecd0;
    --bad: #c73d31;
    --bad-soft: #fbe0dc;
    --info: #4a5568;
    --bar: #2f6feb;
    --bar-2: #7aa5f2;
    --bar-3: #9db8ee;
    --grid: #e9edf3;
    --shadow-sm: 0 1px 2px rgba(20, 24, 33, 0.06);
    --shadow: 0 1px 3px rgba(20, 24, 33, 0.09), 0 1px 2px rgba(20, 24, 33, 0.05);
    --shadow-lg: 0 10px 30px rgba(20, 24, 33, 0.16);
    --radius: 11px;
    --radius-sm: 7px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sev-critical: #c73d31;
    --sev-high: #d1662a;
    --sev-medium: #a9760c;
    --sev-low: #2f6feb;
    --sev-informational: #5c6572;
    --t-fast: 120ms;
    --t-med: 220ms;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  :root[data-theme="dark"], :root.dark {
    --bg: #12151a;
    --panel: #1a1e25;
    --panel-2: #222732;
    --panel-3: #2a3040;
    --border: #2b313c;
    --border-strong: #3a4150;
    --text: #e9ebef;
    --text-2: #c3c8d1;
    --muted: #9aa4b2;
    --accent: #5b8cff;
    --accent-2: #6f9bff;
    --accent-soft: #22314f;
    --good: #45c489;
    --good-soft: #17352a;
    --warn: #e0ad4a;
    --warn-soft: #3a2f16;
    --bad: #ea6a5c;
    --bad-soft: #3a1f1c;
    --info: #9aa4b2;
    --bar: #5b8cff;
    --bar-2: #3a5488;
    --bar-3: #2c3f66;
    --grid: #262c37;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.42);
    --shadow-lg: 0 12px 34px rgba(0, 0, 0, 0.55);
    --sev-critical: #ea6a5c;
    --sev-high: #e08a4a;
    --sev-medium: #e0ad4a;
    --sev-low: #5b8cff;
    --sev-informational: #9aa4b2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a;
      --panel: #1a1e25;
      --panel-2: #222732;
      --panel-3: #2a3040;
      --border: #2b313c;
      --border-strong: #3a4150;
      --text: #e9ebef;
      --text-2: #c3c8d1;
      --muted: #9aa4b2;
      --accent: #5b8cff;
      --accent-2: #6f9bff;
      --accent-soft: #22314f;
      --good: #45c489;
      --good-soft: #17352a;
      --warn: #e0ad4a;
      --warn-soft: #3a2f16;
      --bad: #ea6a5c;
      --bad-soft: #3a1f1c;
      --info: #9aa4b2;
      --bar: #5b8cff;
      --bar-2: #3a5488;
      --bar-3: #2c3f66;
      --grid: #262c37;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.42);
      --shadow-lg: 0 12px 34px rgba(0, 0, 0, 0.55);
      --sev-critical: #ea6a5c;
      --sev-high: #e08a4a;
      --sev-medium: #e0ad4a;
      --sev-low: #5b8cff;
      --sev-informational: #9aa4b2;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background var(--t-med) var(--ease), color var(--t-med) var(--ease);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { margin: 0; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  header.top {
    position: sticky; top: 0; z-index: 30;
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header.top .brand { display: flex; align-items: baseline; gap: 10px; }
  header.top h1 { font-size: 16px; font-weight: 660; letter-spacing: -0.01em; }
  header.top .sub { color: var(--muted); font-size: 12.5px; }
  header.top .spacer { flex: 1; }
  header.top .stamp { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  .ctrl {
    appearance: none; border: 1px solid var(--border-strong); background: var(--panel-2);
    color: var(--text-2); font: inherit; font-size: 12.5px; padding: 6px 11px;
    border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  }
  .ctrl:hover { border-color: var(--accent); color: var(--accent); }
  .ctrl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctrl svg { width: 15px; height: 15px; }

  nav.tabs {
    display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 16px 0;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 52px; z-index: 29;
  }
  nav.tabs button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 13.5px; padding: 9px 13px; cursor: pointer;
    border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0;
    transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
  }
  nav.tabs button:hover { color: var(--text); background: var(--panel-2); }
  nav.tabs button[aria-selected="true"] {
    color: var(--accent); border-bottom-color: var(--accent); font-weight: 620;
  }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  main { padding: 22px; max-width: 1220px; margin: 0 auto; }
  section.tabpanel { display: none; }
  section.tabpanel.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  section.tabpanel.active { animation: fadeUp var(--t-med) var(--ease); }

  .grid { display: grid; gap: 14px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); margin-bottom: 18px; }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 16px; box-shadow: var(--shadow-sm);
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast), border-color var(--t-fast);
  }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--border-strong); }
  .tile .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .tile .value { font-size: 25px; font-weight: 680; margin-top: 6px; letter-spacing: -0.02em; }
  .tile .value.na { color: var(--muted); font-size: 16px; font-weight: 600; }
  .tile .value small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .tile .note { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow-sm); margin-bottom: 16px;
  }
  .panel > h2 { font-size: 14px; font-weight: 640; display: flex; align-items: center; gap: 8px; }
  .panel .desc { color: var(--muted); font-size: 12.5px; margin: 4px 0 14px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-head h2 { font-size: 14px; font-weight: 640; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tbody tr { transition: background var(--t-fast); }
  tbody tr:hover { background: var(--panel-2); }
  tr:last-child td { border-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.truncate { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
  @media (max-width: 820px) { td.truncate { max-width: 200px; } }
  .scroll { overflow-x: auto; }

  .bars { display: flex; flex-direction: column; gap: 7px; }
  .barrow { display: grid; grid-template-columns: 160px 1fr 78px; align-items: center; gap: 10px; font-size: 13px; }
  .barrow .name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bartrack { background: var(--panel-2); border-radius: 5px; height: 15px; overflow: hidden; }
  .barfill { background: var(--bar); height: 100%; border-radius: 5px; min-width: 2px; transition: width var(--t-med) var(--ease); }
  .barrow .val { text-align: right; font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip.cat { background: var(--panel-2); color: var(--muted); }
  .pill { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 9px; border-radius: 999px; }
  .sev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .sev.critical { color: var(--sev-critical); background: var(--bad-soft); }
  .sev.high { color: var(--sev-high); background: var(--warn-soft); }
  .sev.medium { color: var(--sev-medium); background: var(--warn-soft); }
  .sev.low { color: var(--sev-low); background: var(--accent-soft); }
  .sev.informational { color: var(--sev-informational); background: var(--panel-2); }

  .empty { color: var(--muted); font-size: 13.5px; padding: 22px; text-align: center; border: 1px dashed var(--border-strong); border-radius: var(--radius); }
  .na-badge { color: var(--warn); font-weight: 600; font-size: 12px; background: var(--warn-soft); padding: 2px 8px; border-radius: 6px; }

  .health-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .health-row:last-child { border-bottom: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--good); } .dot.no { background: var(--muted); } .dot.warn { background: var(--warn); }
  .health-row .h-label { flex: 1; } .health-row .h-val { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .filter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter input, .filter select {
    background: var(--panel-2); border: 1px solid var(--border-strong); color: var(--text);
    border-radius: var(--radius-sm); padding: 7px 10px; font: inherit; font-size: 13px;
  }
  .filter input[type=search] { min-width: 190px; }
  .filter input:focus-visible, .filter select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button { appearance: none; border: 0; background: var(--panel-2); color: var(--muted); font: inherit; font-size: 12.5px; padding: 6px 11px; cursor: pointer; border-right: 1px solid var(--border); transition: background var(--t-fast), color var(--t-fast); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  button.action {
    appearance: none; border: 1px solid var(--border-strong); background: var(--panel-2);
    color: var(--text); font: inherit; font-size: 13px; padding: 8px 14px; border-radius: var(--radius-sm);
    cursor: pointer; transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  }
  button.action:hover { border-color: var(--accent); color: var(--accent); }
  button.action.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.action.primary:hover { background: var(--accent-2); color: #fff; }
  button.action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .finding { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; background: var(--panel); transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  .finding:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .finding .fhead { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .finding .ftitle { font-weight: 620; font-size: 14px; }
  .finding .fbody { margin-top: 9px; font-size: 13px; color: var(--text-2); }
  .finding .fblock { margin-top: 9px; }
  .finding .fblock .flabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .finding .evidence { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text-2); overflow-x: auto; }
  .finding .example { border-left: 3px solid var(--accent); padding-left: 11px; }

  .score-ring { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .score-ring svg { flex: none; }
  .score-ring .score-num { font-size: 30px; font-weight: 720; letter-spacing: -0.02em; }
  .score-ring .score-meta { font-size: 12.5px; color: var(--muted); max-width: 460px; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(10, 13, 18, 0.55); z-index: 50; display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; animation: fadeIn var(--t-fast) var(--ease); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 760px; padding: 0; animation: modalIn var(--t-med) var(--ease); }
  @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(0.99); } to { opacity: 1; transform: none; } }
  .modal .mhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); border-radius: 14px 14px 0 0; }
  .modal .mhead h3 { font-size: 15px; font-weight: 660; }
  .modal .mbody { padding: 18px 20px; }
  .modal .mclose { appearance: none; border: 0; background: var(--panel-2); color: var(--text-2); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1; }
  .modal .mclose:hover { color: var(--bad); }
  .modal .mclose:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--bad); color: var(--text); padding: 11px 16px; border-radius: var(--radius); box-shadow: var(--shadow-lg); z-index: 60; font-size: 13px; max-width: 90vw; display: none; }
  .toast.show { display: block; animation: fadeUp var(--t-fast) var(--ease); }

  svg .axis { stroke: var(--border-strong); }
  svg .gridline { stroke: var(--grid); }
  svg text { fill: var(--muted); font-family: var(--sans); }
  svg .col { fill: var(--bar); transition: fill var(--t-fast); }
  svg .col:hover { fill: var(--accent-2); }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .note-foot { color: var(--muted); font-size: 12px; text-align: center; padding: 22px 0 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); }

  @media (max-width: 820px) {
    .two-col { grid-template-columns: 1fr; }
    .barrow { grid-template-columns: 116px 1fr 62px; }
    header.top { padding: 11px 15px; } main { padding: 15px; }
    nav.tabs { top: 49px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* Print / PDF report. Hidden on screen; the only thing shown when printing. */
  #print-report { display: none; }
  @media print {
    @page { size: A4; margin: 18mm 16mm; }
    header.top, nav.tabs, main, .modal-backdrop, .toast { display: none !important; }
    #print-report { display: block !important; color: #000; background: #fff; font-size: 11pt; }
    #print-report h1 { font-size: 20pt; margin-bottom: 2mm; }
    #print-report h2 { font-size: 13pt; margin: 8mm 0 2mm; border-bottom: 1px solid #999; padding-bottom: 1mm; page-break-after: avoid; }
    #print-report h3 { font-size: 11pt; margin: 4mm 0 1mm; page-break-after: avoid; }
    #print-report .rmeta { color: #444; font-size: 9pt; }
    #print-report table { width: 100%; border-collapse: collapse; font-size: 9pt; page-break-inside: auto; }
    #print-report th, #print-report td { border: 1px solid #bbb; padding: 3px 5px; text-align: left; }
    #print-report tr { page-break-inside: avoid; }
    #print-report .rfinding { border: 1px solid #ccc; padding: 3mm; margin: 2mm 0; page-break-inside: avoid; }
    #print-report .rsev { font-weight: bold; text-transform: uppercase; font-size: 8pt; }
    #print-report .rfoot { margin-top: 6mm; font-size: 8pt; color: #555; border-top: 1px solid #999; padding-top: 2mm; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 data-i18n="app.title">Craft Suite</h1>
    <span class="sub" data-i18n="app.subtitle">Control Center</span>
  </div>
  <span class="spacer"></span>
  <span class="stamp" id="stamp"></span>
  <button class="ctrl" id="btn-export" data-i18n-aria="controls.export" aria-label="Export">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <span data-i18n="controls.export">Export</span>
  </button>
  <button class="ctrl" id="btn-lang" aria-label="Language">
    <span id="lang-label">EN</span>
  </button>
  <button class="ctrl" id="btn-theme" data-i18n-aria="controls.theme" aria-label="Toggle theme">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4 12H2m20 0h-2m-2.5-7.5L16 6M6 18l-1.5 1.5M18 18l1.5 1.5M6 6 4.5 4.5"/></svg>
  </button>
</header>

<nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>

<main>
  <section class="tabpanel active" id="tab-dashboard" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-sessions" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-analytics" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-optimization" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-usage" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-projects" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-skills" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-agents" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-health" role="tabpanel" tabindex="0"></section>
  <section class="tabpanel" id="tab-privacy" role="tabpanel" tabindex="0"></section>
  <p class="note-foot" data-i18n="app.footer">All figures are read from local files on this machine. Nothing is sent anywhere. Token counts are the real usage figures recorded in your transcripts.</p>
</main>

<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal">
    <div class="mhead">
      <h3 id="modal-title"></h3>
      <button class="mclose" id="modal-close" aria-label="Close">&times;</button>
    </div>

// Hand-authored SVG bar chart with an accessible table alternative.
function barChart(series, opts) {

  const n = series.length, slot = (W - padL * 2) / n, bw = Math.min(slot * 0.62, 22);

    r.setAttribute("x", x - bw / 2); r.setAttribute("y", H - padB - h);

  base.setAttribute("x1", padL); base.setAttribute("x2", W - padL);

  ])]);

}

/* ---------------- date range filtering ---------------- */
function inRange(iso) {
  if (state.range === "all" || !iso) return true;
  const d = new Date(iso); const now = new Date();
  if (state.range === "today") return d.toDateString() === now.toDateString();
  if (state.range === "7d") return (now - d) <= 7 * 864e5;
  if (state.range === "30d") return (now - d) <= 30 * 864e5;
  if (state.range === "month") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();

}

  const esc = s => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  let rows = [["project", "started", "messages", "tokens_in", "tokens_out", "tokens_total"].join(",")];
  rep.sessions.forEach(s => rows.push([esc(s.project), esc(s.started), s.messages, s.tokens_in, s.tokens_out, s.tokens_total].join(",")));
  return rows.join("\n");
}
function buildPrintReport(rep) {
  const host = document.getElementById("print-report");
  host.innerHTML = reportToHTML(rep)
    .replace(/^[\s\S]*<body>/, "").replace(/<\/body>[\s\S]*$/, "")
    .replace(/<h2>/g, "<h2>").replace(/class='meta'/g, "class='rmeta'").replace(/class='sev'/g, "class='rsev'").replace(/class='foot'/g, "class='rfoot'");
}
function doExport(scope, fmt) {
  try {
    const rep = buildReport(scope);
    const base = "skill-suite-report-" + new Date().toISOString().slice(0, 10);
    if (fmt === "json") download(base + ".json", JSON.stringify(rep, null, 2), "application/json");
    else if (fmt === "csv") download(base + ".csv", reportToCSV(rep), "text/csv");
    else if (fmt === "html") download(base + ".html", reportToHTML(rep), "text/html");
    else if (fmt === "pdf") { buildPrintReport(rep); setTimeout(() => window.print(), 60); }
  } catch (e) { showToast(t("toast.export_fail")); }
}
function openExport() {
  const body = document.getElementById("modal-body"); clear(body);
  document.getElementById("modal-title").textContent = t("export.title");
  const scopeSel = el("select", null, [
    el("option", { value: "full" }, t("export.scope.full")),
    el("option", { value: "optimization" }, t("export.scope.optimization")),
    el("option", { value: "usage" }, t("export.scope.usage")),
  ]);
  const fmts = [["html", t("export.fmt.html")], ["json", t("export.fmt.json")], ["csv", t("export.fmt.csv")], ["pdf", t("export.fmt.pdf")]];
  const btns = el("div", { class: "filter", style: "margin-top:14px" }, fmts.map(([f, label]) =>
    el("button", { class: "action" + (f === "pdf" ? " primary" : ""), onclick: () => { doExport(scopeSel.value, f); if (f !== "pdf") closeModal(); } }, label)));
  body.appendChild(el("div", { class: "filter" }, [el("label", { style: "font-size:13px;color:var(--muted)" }, t("export.scope")), scopeSel]));
  body.appendChild(btns);
  body.appendChild(el("p", { class: "desc", style: "margin-top:14px" }, t("export.pdf_hint")));
  lastFocus = document.activeElement;
  document.getElementById("modal-backdrop").classList.add("open");
  document.getElementById("modal-close").focus();
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function showToast(msg) {
  const el0 = document.getElementById("toast"); el0.textContent = msg; el0.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el0.classList.remove("show"), 5000);
}

/* ---------------- tabs, theme, lang ---------------- */
function buildTabs() {
  const nav = document.getElementById("tabs"); clear(nav);
  TABS.forEach((id, i) => nav.appendChild(el("button", {
    role: "tab", id: "tabbtn-" + id, "aria-controls": "tab-" + id, "aria-selected": id === state.tab ? "true" : "false",
    onclick: () => selectTab(id),
  }, t("tab." + id))));
}
function selectTab(id) {
  state.tab = id;
  TABS.forEach(tid => {
    document.getElementById("tab-" + tid).classList.toggle("active", tid === id);
    const b = document.getElementById("tabbtn-" + tid); if (b) b.setAttribute("aria-selected", tid === id ? "true" : "false");
  });
  if (DATA && RENDERERS[id]) RENDERERS[id]();
}
function applyStaticI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(n => { n.textContent = t(n.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-aria]").forEach(n => { n.setAttribute("aria-label", t(n.getAttribute("data-i18n-aria"))); });
  document.getElementById("lang-label").textContent = LANG.toUpperCase();
  if (DATA) document.getElementById("stamp").textContent = t("stamp.updated", { time: fmtDate(DATA.generated_at) });
}
function setLang(l) { LANG = l; store("cc_lang", l); applyStaticI18n(); buildTabs(); selectTab(state.tab); }
function currentTheme() { return document.documentElement.getAttribute("data-theme"); }
function setTheme(mode) {
  if (mode) document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
  store("cc_theme", mode || "");
}
function effectiveDark() {
  const th = currentTheme();
  if (th === "dark") return true; if (th === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function toggleTheme() { setTheme(effectiveDark() ? "light" : "dark"); }

/* ---------------- load ---------------- */
async function loadData() {
  buildTabs(); applyStaticI18n();
  try {
    const r = await fetch("/api/data");
    if (!r.ok) throw new Error("http " + r.status);
    DATA = await r.json();
    if (DATA.error) throw new Error(DATA.error);
  } catch (e) {
    showToast(t("toast.load_fail"));
    document.getElementById("tab-dashboard").appendChild(el("div", { class: "panel" }, el("div", { class: "empty" }, t("toast.load_fail"))));
    return;
  }
  applyStaticI18n();
  selectTab(state.tab);
}

/* ---------------- events ---------------- */
document.getElementById("btn-theme").addEventListener("click", toggleTheme);
document.getElementById("btn-lang").addEventListener("click", () => setLang(LANG === "en" ? "fr" : "en"));
document.getElementById("btn-export").addEventListener("click", openExport);
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") closeModal(); });
// Focus trap: while the dialog is open, keep Tab within it.
document.getElementById("modal-backdrop").addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const modal = document.getElementById("modal");
  const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if (document.getElementById("modal-backdrop").classList.contains("open")) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  const idx = TABS.indexOf(state.tab);
  if (e.key === "ArrowRight" && idx >= 0) { e.preventDefault(); selectTab(TABS[(idx + 1) % TABS.length]); document.getElementById("tabbtn-" + state.tab).focus(); }
  if (e.key === "ArrowLeft" && idx >= 0) { e.preventDefault(); selectTab(TABS[(idx - 1 + TABS.length) % TABS.length]); document.getElementById("tabbtn-" + state.tab).focus(); }
});

/* ---------------- init ---------------- */
(function init() {
  const savedLang = load("cc_lang"); if (savedLang === "fr" || savedLang === "en") LANG = savedLang;
  const savedTheme = load("cc_theme"); if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
  loadData();
})();
</script>
</body>
</html>
