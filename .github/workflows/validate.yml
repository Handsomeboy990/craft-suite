# Runs the five validation scripts on every pull request into dev and main.
#
# Its purpose is to be a required status check. Branch protection that only
# requires a review lets a broken change through whenever the reviewer is
# tired; a required check does not. Setup:
# documentation/branch-protection.md
name: validate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    # This name is the required status check context in branch protection.
    # Do not rename it when adding a step: the job runs more than the four it
    # lists (model routing and the Control Center tests too), but renaming the
    # job would leave branch protection waiting for a context that never
    # reports again. The name is a stable label, not an inventory.
    name: structure, rules, orchestration, plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structure and metadata
        run: bash tests/validate-structure.sh

      - name: Repository rules
        run: bash tests/validate-rules.sh

      - name: Orchestration coherence
        run: bash tests/validate-orchestration.sh

      - name: Plugin bundles in sync with the trees
        run: bash tests/validate-plugins.sh

      - name: Model routing fixtures match the routing table
        run: bash tests/validate-model-routing.sh

      - name: Documentation counts match the trees
        run: bash tests/validate-counts.sh

      - name: Control Center parses, runs and passes its tests
        run: |
          python3 -c "import ast; ast.parse(open('control-center/reader.py').read())"
          python3 -c "import ast; ast.parse(open('control-center/server.py').read())"
          python3 -c "import ast; ast.parse(open('control-center/advisor.py').read())"
          python3 control-center/reader.py --json > /dev/null
          python3 control-center/advisor.py > /dev/null
          python3 control-center/test_advisor.py
          python3 control-center/test_reader.py
          python3 tests/check-app-js.py

      - name: Shell syntax
        run: |
          for script in install.sh plugins/build.sh tests/*.sh .githooks/*; do
            [ -f "$script" ] || continue
            bash -n "$script"
          done

      - name: Libraries follow their contract
        run: |
          # Every libraries/<name>/ ships with its own LICENSE and README.md,
          # per libraries/README.md. Empty-safe: passes while none has landed.
          status=0
          if [ -d libraries ]; then
            for dir in libraries/*/; do
              [ -d "$dir" ] || continue
              name="$(basename "$dir")"
              [ -f "$dir/LICENSE" ]   || { echo "library $name: LICENSE missing"; status=1; }
              [ -f "$dir/README.md" ] || { echo "library $name: README.md missing"; status=1; }
            done
          fi
          exit "$status"

      - name: Node for the libraries that carry their own toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Libraries typecheck and test
        run: |
          # A library with a package.json carries its own typecheck and test.
          # This is the contract's gate tightening now that the first library
          # has landed. Empty-safe: the loop body runs only for such libraries.
          status=0
          for pkg in libraries/*/package.json; do
            [ -f "$pkg" ] || continue
            dir="$(dirname "$pkg")"
            echo "::group::$dir"
            # The repository gitignores lockfiles by convention, so install,
            # not ci, which would demand a committed package-lock.json.
            ( cd "$dir" && npm install --no-audit --no-fund \
                && npm run typecheck \
                && npm test ) || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Site-template examples keep one source for their shared code
        run: |
          # The code the two site-template examples share lives once, in
          # examples/_shared, listed in examples/shared-files.txt. Each example
          # installs it as the local package site-template-shared and passes
          # its own content model in. What Next requires inside each app stays
          # there as a thin file, listed with its reason in
          # examples/app-local-files.txt. This guard fails if a shared file is
          # missing from the source, if a copy reappears in an example (it would
          # shadow the source and drift), if the list and the source disagree,
          # if a shared directory is left out of the package, if the shared code
          # imports anything from an example, if an example is no longer wired
          # to the package, if any file is identical in both examples without
          # being listed as app local, if a listed file grows into logic, or if
          # an example goes back to the deprecated middleware.ts.
          EX=engineering/dev-skills/site-template-generation/examples
          SH="$EX/_shared"
          APPS="portfolio-sports-coach showcase-electrician"
          status=0
          SHARED_LIST=$(grep -vE '^[[:space:]]*(#|$)' "$EX/shared-files.txt")
          LOCAL_LIST=$(grep -vE '^[[:space:]]*(#|$)' "$EX/app-local-files.txt")
          while IFS= read -r rel; do
            [ -f "$SH/$rel" ] || { echo "shared file missing from _shared: $rel"; status=1; }
            for app in $APPS; do
              [ ! -e "$EX/$app/$rel" ] || { echo "copy of a shared file in $app: $rel"; status=1; }
            done
          done <<< "$SHARED_LIST"
          for f in $(cd "$SH" && find . -type f ! -path './node_modules/*' ! -name README.md ! -name package.json | sed 's#^\./##' | sort); do
            grep -qxF "$f" <<< "$SHARED_LIST" || { echo "file in _shared not listed in shared-files.txt: $f"; status=1; }
          done
          for dir in $(cut -d/ -f1 <<< "$SHARED_LIST" | sort -u); do
            grep -qF "\"$dir\"" "$SH/package.json" \
              || { echo "_shared/package.json does not ship $dir/ in its files"; status=1; }
          done
          if grep -rnE "(from|import) ['\"](@/|(\.\./)+(portfolio-sports-coach|showcase-electrician|dashboard-hotel-operations)/)" "$SH" --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.css'; then
            echo "the shared code imports from an example; pass the value in instead"; status=1
          fi
          for app in $APPS; do
            A="$EX/$app"
            grep -qF '"site-template-shared": "file:../_shared"' "$A/package.json" \
              || { echo "$app does not depend on file:../_shared"; status=1; }
            grep -qxF 'install-links=true' "$A/.npmrc" 2>/dev/null \
              || { echo "$app/.npmrc does not set install-links=true"; status=1; }
            grep -qF "transpilePackages: ['site-template-shared']" "$A/next.config.mjs" \
              || { echo "$app/next.config.mjs does not transpile site-template-shared"; status=1; }
          done
          P="$EX/portfolio-sports-coach"
          S="$EX/showcase-electrician"
          for f in $(cd "$P" && git ls-files --cached --others --exclude-standard . | sort); do
            if [ -f "$S/$f" ] && cmp -s "$P/$f" "$S/$f"; then
              grep -qxF "$f" <<< "$LOCAL_LIST" \
                || { echo "identical in both site examples, move it to _shared or list it in app-local-files.txt: $f"; status=1; }
            fi
          done
          while IFS= read -r rel; do
            for app in $APPS; do
              [ -f "$EX/$app/$rel" ] || { echo "app-local-files.txt lists $rel, missing from $app"; status=1; continue; }
              case "$rel" in
                *.ts|*.tsx|*.mjs)
                  grep -qF "site-template-shared/" "$EX/$app/$rel" \
                    || { echo "$app/$rel is listed as app local but does not delegate to site-template-shared"; status=1; }
                  [ "$(wc -l < "$EX/$app/$rel")" -le 25 ] \
                    || { echo "$app/$rel is listed as app local but is longer than 25 lines: move its logic to _shared"; status=1; } ;;
              esac
            done
          done <<< "$LOCAL_LIST"
          for app in $APPS dashboard-hotel-operations; do
            [ ! -e "$EX/$app/middleware.ts" ] || { echo "$app still has middleware.ts; Next 16 reads proxy.ts"; status=1; }
            [ -f "$EX/$app/proxy.ts" ] || { echo "$app has no proxy.ts"; status=1; }
          done
          exit "$status"

      - name: No forbidden attribution in the commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          [ -n "$base" ] || exit 0
          if git log --format='%an%n%ae%n%s%n%b' "$base..$head" \
             | grep -inE 'co-authored-by|generated by|created with|assisted by|claude|chatgpt|copilot'; then
            echo "A commit attributes the work to a tool. Amend it before merging."
            exit 1
          fi
