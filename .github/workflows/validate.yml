# Runs the five validation scripts on every pull request into dev and main.
#
# Its purpose is to be a required status check. Branch protection that only
# requires a review lets a broken change through whenever the reviewer is
# tired; a required check does not. Setup:
# documentation/branch-protection.md
name: validate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    # This name is the required status check context in branch protection.
    # Do not rename it when adding a step: the job runs more than the four it
    # lists (model routing and the Control Center tests too), but renaming the
    # job would leave branch protection waiting for a context that never
    # reports again. The name is a stable label, not an inventory.
    name: structure, rules, orchestration, plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structure and metadata
        run: bash tests/validate-structure.sh

      - name: Repository rules
        run: bash tests/validate-rules.sh

      - name: Orchestration coherence
        run: bash tests/validate-orchestration.sh

      - name: Plugin bundles in sync with the trees
        run: bash tests/validate-plugins.sh

      - name: Model routing fixtures match the routing table
        run: bash tests/validate-model-routing.sh

      - name: Documentation counts match the trees
        run: bash tests/validate-counts.sh

      - name: Control Center parses, runs and passes its tests
        run: |
          python3 -c "import ast; ast.parse(open('control-center/reader.py').read())"
          python3 -c "import ast; ast.parse(open('control-center/server.py').read())"
          python3 -c "import ast; ast.parse(open('control-center/advisor.py').read())"
          python3 control-center/reader.py --json > /dev/null
          python3 control-center/advisor.py > /dev/null
          python3 control-center/test_advisor.py
          python3 control-center/test_reader.py
          python3 tests/check-app-js.py

      - name: Shell syntax
        run: |
          for script in install.sh plugins/build.sh tests/*.sh .githooks/*; do
            [ -f "$script" ] || continue
            bash -n "$script"
          done

      - name: Libraries follow their contract
        run: |
          # Every libraries/<name>/ ships with its own LICENSE and README.md,
          # per libraries/README.md. Empty-safe: passes while none has landed.
          status=0
          if [ -d libraries ]; then
            for dir in libraries/*/; do
              [ -d "$dir" ] || continue
              name="$(basename "$dir")"
              [ -f "$dir/LICENSE" ]   || { echo "library $name: LICENSE missing"; status=1; }
              [ -f "$dir/README.md" ] || { echo "library $name: README.md missing"; status=1; }
            done
          fi
          exit "$status"

      - name: Node for the libraries that carry their own toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Libraries typecheck and test
        run: |
          # A library with a package.json carries its own typecheck and test.
          # This is the contract's gate tightening now that the first library
          # has landed. Empty-safe: the loop body runs only for such libraries.
          status=0
          for pkg in libraries/*/package.json; do
            [ -f "$pkg" ] || continue
            dir="$(dirname "$pkg")"
            echo "::group::$dir"
            # The repository gitignores lockfiles by convention, so install,
            # not ci, which would demand a committed package-lock.json.
            ( cd "$dir" && npm install --no-audit --no-fund \
                && npm run typecheck \
                && npm test ) || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: No forbidden attribution in the commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          [ -n "$base" ] || exit 0
          if git log --format='%an%n%ae%n%s%n%b' "$base..$head" \
             | grep -inE 'co-authored-by|generated by|created with|assisted by|claude|chatgpt|copilot'; then
            echo "A commit attributes the work to a tool. Amend it before merging."
            exit 1
          fi
